<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Application Form</title>
</head>
<body>

<form>
<fieldset>
<legend>Job Application Form</legend>

<table>
<tr>
    <td>First Name:</td>
    <td><input type="text" name="firstName"></td>
</tr>

<tr>
    <td>Last Name:</td>
    <td><input type="text" name="lastName"></td>
</tr>

<tr>
    <td>Email:</td>
    <td><input type="email" name="email"></td>
</tr>

<tr>
    <td>Phone Number:</td>
    <td><input type="number" name="contact"></td>
</tr>

<tr>
    <td>DOB:</td>
    <td><input type="date" name="dob"></td>
</tr>

<tr>
    <td>Gender:</td>
    <td>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
    </td>
</tr>

<tr>
    <td>Skills:</td>
    <td>
        <input type="checkbox" name="skill" value="HTML"> HTML
        <input type="checkbox" name="skill" value="CSS"> CSS
        <input type="checkbox" name="skill" value="JS"> JS
    </td>
</tr>

<tr>
    <td>Address:</td>
    <td><textarea name="address"></textarea></td>
</tr>

<tr>
    <td>City:</td>
    <td><input type="text" name="city"></td>
</tr>

<tr>
    <td>State:</td>
    <td>
        <select name="state">
            <option disabled selected>--Select State--</option>
            <option>Gujarat</option>
            <option>Rajasthan</option>
            <option>Tamil Nadu</option>
        </select>
    </td>
</tr>

<tr>
    <td>Pincode:</td>
    <td><input type="number" name="pincode"></td>
</tr>

<tr>
    <td>Position:</td>
    <td>
        <input list="roles" name="role">
        <datalist id="roles">
            <option value="Frontend Developer">
            <option value="Backend Developer">
            <option value="Full Stack Developer">
            <option value="MERN Developer">
        </datalist>
    </td>
</tr>

<tr>
    <td>Resume:</td>
    <td><input type="file" name="resume" accept=".pdf"></td>
</tr>

<tr>
    <td>LinkedIn:</td>
    <td><input type="url" name="linkedin"></td>
</tr>

<tr>
    <td>Start Date:</td>
    <td><input type="date" name="startdate"></td>
</tr>

<tr>
    <td>Expected Salary:</td>
    <td>
        10,000
        <input type="range" name="salary" min="10000" max="50000" step="10000">
        50,000
    </td>
</tr>

<tr>
    <td>Relocate:</td>
    <td>
        <select name="relocate">
            <option>Yes</option>
            <option>No</option>
        </select>
    </td>
</tr>

<tr>
    <td><input type="reset"></td>
    <td><input type="submit" value="Submit Application"></td>
</tr>

</table>

</fieldset>
</form>

</body>
</html>
