<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tables in HTML</h1>
    <table border="1">
        <caption>Student data</caption>
        <tr>
            <td>Sr.NO </td>
            <td>Name </td>
            <td>Hobby </td>
        </tr>
        <tr>
            <td>1.</td>
            <td>Harshal</td>
            <td>Cricket</td>
        </tr>
        <tr>
            <td>2.</td>
            <td>Viren</td>
            <td>Football</td>
        </tr>
    </table>

    <table border="1">
        <caption>Student data with head</caption>
        <thead>
            <tr>
            <th>Sr.NO </th>
            <th>Name </th>
            <th>Hobby </th>
        </tr>
        </thead>
        <tbody>
            <tr>
            <td>1.</td>
            <td>Harshal</td>
            <td>Cricket</td>
        </tr>
        <tr>
            <td>2.</td>
            <td>Viren</td>
            <td>Football</td>
        </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total guy:</td>
                <td>2</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
