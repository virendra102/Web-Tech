<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>select tag in Forms - (dropdown list)</h1>
    <form action="">
        <label for="">Skills:</label>
        <select name="selectedSkill" id="" >
            <option value="" disabled selected>--Select Any Skill--</option>
            <optgroup label="Frontend">
                 <option value="html">HTML </option>
                 <option value="css">css</option>
                 <option value="js">JS </option>
                 <option value="tailwind">tailwind</option>
                 <option value="reactjs">ReactJS </option>
            </optgroup>
            <optgroup label="Backend">
                <option value="Java">Java </option>
                <option value="Python">Python</option>
                <option value="Node.js">Node.js</option>
                <option value="Express.js">Express.js</option>
            </optgroup>
        </select>
        <button type="submit">Submit Skill</button>
    </form>

    <!-- =============================Select multiple================================= -->

    <form action="" >
        <label for="">Skills:</label>
        <select name="selectedSkill" id="" multiple size="1">
            <option value="" disabled selected>--Select Any Skill--</option>
            <optgroup label="Frontend">
                 <option value="html">HTML </option>
                 <option value="css">css</option>
                 <option value="js">JS </option>
                 <option value="tailwind">tailwind</option>
                 <option value="reactjs">ReactJS </option>
            </optgroup>
            <optgroup label="Backend">
                <option value="Java">Java </option>
                <option value="Python">Python</option>
                <option value="Node.js">Node.js</option>
                <option value="Express.js">Express.js</option>
            </optgroup>
        </select>
        <button type="submit">Submit Skill</button>
    </form>
</body>
</html>
