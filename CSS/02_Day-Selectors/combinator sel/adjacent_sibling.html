<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 + p {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>2.3 Adjacent Sibling Selector</h1>
    The adjacent sibling combinator (+) selects elements that are direct siblings of a specified element.
    <div>
        <h1>You</h1>
        <p>Paragraph 1</p>
        <p>Paragraph 2</p>
        <p>Paragraph 3</p>
    </div>
</body>
</html>
