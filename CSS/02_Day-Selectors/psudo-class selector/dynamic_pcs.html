<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:link {
            color: blue;
            text-decoration: none;
        }
        a:visited {
            color: purple;
        }
        a:hover {
            color: orange;
            text-decoration: underline;
        }
        a:active {
            color: red;
        }
        input:focus {
            border: 2px solid green;
            outline: none;
        }
    </style>
</head>
<body>
    <h1>4. Pseudo-Class Selecttors</h1>
    <p>These selectors target elements based on their state or position in the document.</p>
    <h2>4.1. Dynamic Pseudo-Class</h2>
    <a href="https://www.google.com">Goo google</a>
    <a href="https://reddit.com">reddit</a>
    <a href="https://discord.com">Discord</a>
    <input type="text">
</body>
</html>
