<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .container {
            display: flex;
            flex-direction: row; /* Default is row */
            width: 100%;
            height: 100vh;
        }
        .item {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h2>flex-direction: row (default)</h2>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
</body>
</html>
