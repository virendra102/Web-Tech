<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box4{
            animation: rotate 4s linear infinite;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background-image: repeating-conic-gradient( blue 0deg 7.5deg, white 7.5deg 15deg);
  margin: 20px auto;
}
        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

    </style>
</head>
<body>
    <div id="box1"></div>
    <div id="box2"></div>
    <div id="box3"></div>
    <div id="box4"></div>
    <div id="box5"></div>
</body>
</html>
