<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #div1 {
            width: 200px;
            height: 100px;
            background: linear-gradient(to right, red, yellow);
            margin-bottom: 10px;
        }
        #div2 {
            width: 200px;
            height: 100px;
            background: linear-gradient(to bottom, blue, green);
            margin-bottom: 10px;
        }
        #div3 {
            width: 200px;
            height: 100px;
            background: linear-gradient(45deg, purple, pink);
            margin-bottom: 10px;
        }
        #div4 {
            width: 200px;
            height: 100px;
            background: linear-gradient(to right, orange, white, orange);
            margin-bottom: 10px;
        }
        #div5 {
            width: 200px;
            height: 100px;
            background: linear-gradient(to bottom right, cyan, magenta, yellow);
            margin-bottom: 10px;
        }
        #div6 {
            width: 200px;
            height: 100px;
            background: linear-gradient(to left, black, gray, white);
            margin-bottom: 10px;
        }
        #div7 {
            width: 200px;
            height: 200px;
            background: linear-gradient(to bottom, lightblue, lightgreen);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #div7 img {
            width: 100px;
            height: auto;
            background: linear-gradient(to bottom, lightblue, lightgreen);
        }
    </style>
</head>
<body>
    <h1>Linear Gradients</h1>
    <div id="div1"></div>
    <div id="div2"></div>
    <div id="div3"></div>
    <div id="div4"></div>
    <div id="div5"></div>
    <div id="div6"></div>
    <div id="div7">
        <img src="https://static.tvtropes.org/pmwiki/pub/images/katsuki_s7_80.png" alt="Bakugo">
    </div>
</body>
</html>
