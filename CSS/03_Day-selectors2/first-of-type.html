<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h3:first-of-type {
            color: blue;
        }
        p:first-of-type {
            color: green;
        }
        h3:last-of-type {
            color: red;
        }
        p:last-of-type {
            color: orange;
        }
        h2:first-of-type {
            color: rgb(218, 110, 185);
        }
    </style>
</head>
<body>
    <section>
        <h3>Heading-1 </h3>
        <h3>Heding-2 </h3>
        <p>para-1</p>
        <h3>Heading-3 </h3>
        <p>para-2</p>
    </section>
    <article>
        <div>
            <h2>hello</h2>
            <h2>ramuoo</h2>
            <h2>shammma</h2>
        </div>
    </article>
</body>
</html>
