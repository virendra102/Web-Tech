<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p:nth-child(odd) {
            background-color: lightgray;
        }
        p:nth-child(even) {
            background-color: lightblue;
        }
        p:nth-child(3n) {
            font-weight: bold;
        }
        p:nth-child(4n+1) {
            color: red;
        }
        p:nth-child(4) {
            color: green;
        }
    </style>
</head>
<body>
    <p>Paragraph-1</p>
    <p>Paragraph-2</p>
    <p>Paragraph-3</p>
    <p>Paragraph-4</p>
    <p>Paragraph-5</p>
    <p>Paragraph-6</p>
    <p>Paragraph-7</p>
    <p>Paragraph-8</p>
</body>
</html>
