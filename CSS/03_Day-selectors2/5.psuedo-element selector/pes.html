<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #para1::first-letter {
            color: red;
            font-size: 2em;
            font-weight: bold;
        }
        #para2::first-line {
            color: blue;
            font-style: italic;
        }
        #para2::before {
            content: "Note: ";
            font-weight: bold;
            color: green;
        }
        #para2::after {
            content: " [End of paragraph]";
            font-weight: bold;
            color: purple;
        }
    </style>
</head>
<body>
    <h1>Pseudo-Element Selector</h1>
    <p id="para1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Saepe, ab.</p>
    <p id="para2">Lorem ipsum dolor sit amet consectetur adipisicing elit. Amet sunt sed laboriosam.</p>
</body>
</html>
