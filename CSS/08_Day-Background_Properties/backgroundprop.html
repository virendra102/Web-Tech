<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family:Arial, Helvetica, sans-serif;
            text-align: center;
        }

        h1{
            padding: 0px;
        }
        .box{
            width:500px;
            height: 200px;
            border: 1px solid;
            margin:20px auto;
        }
        #box1{background-color: red;}
        #box2{
            width: 400px;
            height:250px;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRYLVHjRE94tHFTVoOll-jg2Y6xozkM_0WoIw&s);
            background-repeat: no-repeat;
            background-size: contain;
        }
        #box3{
            height: 300px;
            background-image: url(https://wallpapers.com/images/featured/4k-aesthetic-anime-qd4ytudgcxbxzab2.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
</body>
</html>
